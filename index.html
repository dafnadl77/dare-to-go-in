<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Dare To Go In — an interactive dream memory experience." />
    <title>Dare To Go In</title>
    <!-- Approved DARE favicon artwork (ivory serif "D" on a night-sky/
         cloud background) — one source image, resized without stretching
         into every size a browser/OS actually requests. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#060706" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Heebo is the one typeface for the whole product UI, EN and HE
         alike (headings/body/buttons/labels/nav) — weights 300-700 cover
         every real use in the app. Fraunces (regular weight only, no
         italic needed) is loaded solely for .memory-title, the "DARE TO
         GO IN" brand mark, which intentionally keeps its own serif
         treatment in every language — see index.css/MemoryTitle.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
