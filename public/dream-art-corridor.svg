<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1214"/>
      <stop offset="55%" stop-color="#132227"/>
      <stop offset="100%" stop-color="#1c2f33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="26%">
      <stop offset="0%" stop-color="#f3e9cf" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d9c9a3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d9c9a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1618" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060a0b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="300" height="380" fill="url(#bgGrad)"/>

  <!-- receding frames, each smaller, converging toward the light -->
  <polygon points="4,378 296,378 226,220 74,220" fill="#0e1a1c" stroke="#2a4247" stroke-width="1.2" stroke-opacity="0.55"/>
  <polygon points="74,220 226,220 190,140 110,140" fill="#0a1416" stroke="#25393d" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="110,140 190,140 172,96 128,96" fill="#081113" stroke="#203035" stroke-width="0.8" stroke-opacity="0.45"/>
  <polygon points="128,96 172,96 163,68 137,68" fill="#060d0f" stroke="#1b282c" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- floor reflection strip -->
  <polygon points="4,378 296,378 226,300 74,300" fill="url(#floorGrad)"/>

  <!-- faint side rails suggesting infinite repetition -->
  <line x1="4" y1="378" x2="137" y2="68" stroke="#233b40" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="296" y1="378" x2="163" y2="68" stroke="#233b40" stroke-width="0.6" stroke-opacity="0.3"/>

  <circle cx="150" cy="82" r="34" fill="url(#glow)"/>
</svg>
